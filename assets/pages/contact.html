<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact | Ourofolios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Désactive la scrollbar et le défilement sur le body */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Empêche tout scroll parasite */
        }

        /* On s'assure que le canvas de fond ne crée pas de décalage */
        #neural-canvas {
            pointer-events: none;
        }

        /* On s'assure que le conteneur principal occupe tout l'espace sans déborder */
        main {
            height: 100vh;
            display: flex;
            align-items: center; /* Centre verticalement le contenu s'il y a de la place */
        }

        /* Animation spécifique pour l'icône Néon vibrant */
        .neon-pulse {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5));
            animation: neon-flicker 4s infinite alternate;
        }

        /* Effet de clignotement / scintillement néon */
        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.8))
                        drop-shadow(0 0 25px rgba(59, 130, 246, 0.4));
                opacity: 1;
            }
            20%, 22%, 24%, 55% {
                filter: none;
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>
<div id="custom-cursor"></div>
<canvas id="neural-canvas" class="fixed top-0 left-0 w-full h-full -z-10 opacity-20"></canvas>

<div id="header-placeholder"></div>

<main class="h-screen overflow-hidden px-6 max-w-7xl mx-auto flex items-center justify-center">
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center -ml-20 w-full">
        <div class="relative min-h-[400px] flex justify-center items-center order-1">
            <div class="about-card-container float-animation group">
                <div class="about-card-halo opacity-40"></div>

                <div class="relative z-10 p-12 neon-pulse">
                    <svg class="w-48 h-48 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="0.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>

                <div class="absolute -bottom-6 -right-6 bg-gray-900 border border-blue-500/50 p-4 rounded-2xl shadow-xl backdrop-blur-xl animate-bounce-slow z-20">
                    <p class="text-[10px] font-mono text-blue-400 uppercase tracking-tighter">Status: Awaiting_Data</p>
                </div>
            </div>
        </div>

        <div class="space-y-8 order-2">
            <h1 class="text-5xl font-black italic uppercase tracking-tighter">
                Initialiser la <span class="gradient-text">connexion</span>
            </h1>

            <form id="contact-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-2">Identité / Nom</label>
                        <input type="text" id="name" name="name" required maxlength="50" placeholder="User_Name"
                               class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-blue-500/50 transition-all text-white font-mono text-sm">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-2">Fréquence / Email</label>
                        <input type="email" id="email" name="email" required placeholder="nom@exemple.com"
                               class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-blue-500/50 transition-all text-white font-mono text-sm">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-2">Protocole / Objet</label>
                    <input type="text" id="subject" name="subject" required maxlength="100" placeholder="Sujet de la transmission"
                           class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-blue-500/50 transition-all text-white font-mono text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-gray-500 ml-2">Données / Message (<span id="char-count">500</span> restants)</label>
                    <textarea id="message" name="message" required maxlength="500" rows="5" placeholder="Écrivez votre message ici..."
                              class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-blue-500/50 transition-all text-white font-mono text-sm resize-none"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold uppercase tracking-widest rounded-2xl transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                    Envoyer la transmission
                </button>
                <p id="form-status" class="text-center text-xs mt-4 font-mono"></p>
            </form>
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>

<script src="../js/main.js"></script>
</body>
</html>
